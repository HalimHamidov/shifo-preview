<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" fill="none">
  <title>Shifo Tajik mosaic seamless ornament</title>
  <defs>
    <style>
      .flow{fill:none;stroke-linecap:butt;stroke-linejoin:round}
      .soft{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <pattern id="tessera" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 28 28 0" stroke="#DDD3BF" stroke-opacity=".16" stroke-width="1"/>
      <circle cx="14" cy="14" r="1.1" fill="#D7B869" fill-opacity=".12"/>
    </pattern>
    <symbol id="drop" viewBox="-34 -104 68 138">
      <path d="M0-99C34-60 35-19 0 31-35-19-34-60 0-99Z" fill="#C68A68" fill-opacity=".18" stroke="#C8D0C3" stroke-opacity=".34" stroke-width="4"/>
      <path d="M0-72C19-45 19-15 0 15-19-15-19-45 0-72Z" fill="#DCE7F2" fill-opacity=".12" stroke="#DCE7F2" stroke-opacity=".34" stroke-width="3"/>
      <path class="soft" d="M0-78C7-47 7-13 0 15" stroke="#D7B869" stroke-opacity=".22" stroke-width="3"/>
    </symbol>
    <symbol id="paisley" viewBox="-125 -125 250 250">
      <path d="M-72 60C-105 5-66-73 8-87c58-11 107 24 106 74-2 67-69 111-132 96 41-11 70-43 70-81 0-28-20-46-47-43-36 3-65 45-49 80 8 19 24 31 47 36-31 15-58 10-75-15Z" fill="#D6E7E6" fill-opacity=".24" stroke="#C8D0C3" stroke-opacity=".34" stroke-width="6"/>
      <path d="M-43 35C-60 1-37-41 2-47c30-5 55 13 53 40-2 36-40 60-73 51 22-6 39-25 39-44 0-14-10-22-23-21-20 2-34 24-25 42 5 10 15 17 28 20-18 7-33 4-44-6Z" fill="#DCE7F2" fill-opacity=".1" stroke="#DCE7F2" stroke-opacity=".33" stroke-width="4"/>
      <circle cx="14" cy="-10" r="12" fill="#D7B869" fill-opacity=".14"/>
    </symbol>
    <symbol id="leafPair" viewBox="-145 -112 290 224">
      <path d="M-112 0C-75-68-19-91 0-24 19-91 75-68 112 0 75 68 19 91 0 24-19 91-75 68-112 0Z" fill="#D6E7E6" fill-opacity=".22" stroke="#C8D0C3" stroke-opacity=".34" stroke-width="5"/>
      <path d="M-66 0C-43-35-18-44 0-16 18-44 43-35 66 0 43 35 18 44 0 16-18 44-43 35-66 0Z" fill="#DCE7F2" fill-opacity=".1" stroke="#DCE7F2" stroke-opacity=".3" stroke-width="4"/>
    </symbol>
    <symbol id="rosette" viewBox="-190 -190 380 380">
      <circle r="168" fill="url(#tessera)" opacity=".34"/>
      <circle r="150" stroke="#DDD3BF" stroke-opacity=".27" stroke-width="18"/>
      <circle r="118" stroke="#DCE7F2" stroke-opacity=".34" stroke-width="10"/>
      <g opacity=".72">
        <use href="#drop" transform="rotate(0) translate(0 -25)"/>
        <use href="#drop" transform="rotate(30) translate(0 -25)"/>
        <use href="#drop" transform="rotate(60) translate(0 -25)"/>
        <use href="#drop" transform="rotate(90) translate(0 -25)"/>
        <use href="#drop" transform="rotate(120) translate(0 -25)"/>
        <use href="#drop" transform="rotate(150) translate(0 -25)"/>
        <use href="#drop" transform="rotate(180) translate(0 -25)"/>
        <use href="#drop" transform="rotate(210) translate(0 -25)"/>
        <use href="#drop" transform="rotate(240) translate(0 -25)"/>
        <use href="#drop" transform="rotate(270) translate(0 -25)"/>
        <use href="#drop" transform="rotate(300) translate(0 -25)"/>
        <use href="#drop" transform="rotate(330) translate(0 -25)"/>
      </g>
      <use href="#paisley" transform="scale(.64) rotate(-18)"/>
      <use href="#paisley" transform="scale(-.64 .64) rotate(-18)"/>
      <circle r="34" fill="#D7B869" fill-opacity=".13" stroke="#DDD3BF" stroke-opacity=".24" stroke-width="6"/>
      <circle r="13" fill="#DCE7F2" fill-opacity=".32"/>
    </symbol>
  </defs>

  <g opacity=".64">
    <path class="flow" d="M0 300C200 180 400 180 600 300C800 420 1000 420 1200 300" stroke="#D6E7E6" stroke-opacity=".28" stroke-width="18"/>
    <path class="flow" d="M0 900C200 780 400 780 600 900C800 1020 1000 1020 1200 900" stroke="#D6E7E6" stroke-opacity=".28" stroke-width="18"/>
    <path class="flow" d="M300 0C180 200 180 400 300 600C420 800 420 1000 300 1200" stroke="#DDD3BF" stroke-opacity=".28" stroke-width="18"/>
    <path class="flow" d="M900 0C780 200 780 400 900 600C1020 800 1020 1000 900 1200" stroke="#DDD3BF" stroke-opacity=".28" stroke-width="18"/>
    <path class="flow" d="M0 600C200 540 400 540 600 600C800 660 1000 660 1200 600" stroke="#C8D0C3" stroke-opacity=".24" stroke-width="10"/>
    <path class="flow" d="M600 0C540 200 540 400 600 600C660 800 660 1000 600 1200" stroke="#C8D0C3" stroke-opacity=".24" stroke-width="10"/>
  </g>

  <g opacity=".42">
    <path class="flow" d="M0 150C200 90 400 90 600 150C800 210 1000 210 1200 150" stroke="#DDD3BF" stroke-opacity=".18" stroke-width="7"/>
    <path class="flow" d="M0 450C200 390 400 390 600 450C800 510 1000 510 1200 450" stroke="#DCE7F2" stroke-opacity=".2" stroke-width="7"/>
    <path class="flow" d="M0 750C200 690 400 690 600 750C800 810 1000 810 1200 750" stroke="#D6E7E6" stroke-opacity=".2" stroke-width="7"/>
    <path class="flow" d="M0 1050C200 990 400 990 600 1050C800 1110 1000 1110 1200 1050" stroke="#DDD3BF" stroke-opacity=".18" stroke-width="7"/>
    <path class="flow" d="M150 0C90 200 90 400 150 600C210 800 210 1000 150 1200" stroke="#DDD3BF" stroke-opacity=".18" stroke-width="7"/>
    <path class="flow" d="M450 0C390 200 390 400 450 600C510 800 510 1000 450 1200" stroke="#DCE7F2" stroke-opacity=".2" stroke-width="7"/>
    <path class="flow" d="M750 0C690 200 690 400 750 600C810 800 810 1000 750 1200" stroke="#D6E7E6" stroke-opacity=".2" stroke-width="7"/>
    <path class="flow" d="M1050 0C990 200 990 400 1050 600C1110 800 1110 1000 1050 1200" stroke="#DDD3BF" stroke-opacity=".18" stroke-width="7"/>
  </g>

  <g opacity=".5">
    <use href="#rosette" transform="translate(600 600)"/>
    <use href="#rosette" transform="translate(0 0) scale(.55)"/>
    <use href="#rosette" transform="translate(1200 0) scale(.55)"/>
    <use href="#rosette" transform="translate(0 1200) scale(.55)"/>
    <use href="#rosette" transform="translate(1200 1200) scale(.55)"/>
    <use href="#rosette" transform="translate(600 0) scale(.48)"/>
    <use href="#rosette" transform="translate(600 1200) scale(.48)"/>
    <use href="#rosette" transform="translate(0 600) scale(.48)"/>
    <use href="#rosette" transform="translate(1200 600) scale(.48)"/>
  </g>

  <g opacity=".46">
    <use href="#leafPair" transform="translate(300 300) rotate(45)"/>
    <use href="#leafPair" transform="translate(900 300) rotate(-45)"/>
    <use href="#leafPair" transform="translate(300 900) rotate(-45)"/>
    <use href="#leafPair" transform="translate(900 900) rotate(45)"/>
    <use href="#paisley" transform="translate(600 260) rotate(90) scale(.72)"/>
    <use href="#paisley" transform="translate(600 940) rotate(-90) scale(.72)"/>
    <use href="#paisley" transform="translate(260 600) scale(.72)"/>
    <use href="#paisley" transform="translate(940 600) scale(-.72 .72)"/>
  </g>

  <g opacity=".38">
    <path d="M150 150C240 55 360 55 450 150C360 245 240 245 150 150Z" fill="#DDD3BF" fill-opacity=".08" stroke="#D7B869" stroke-opacity=".2" stroke-width="5"/>
    <path d="M750 150C840 55 960 55 1050 150C960 245 840 245 750 150Z" fill="#DDD3BF" fill-opacity=".08" stroke="#D7B869" stroke-opacity=".2" stroke-width="5"/>
    <path d="M150 1050C240 955 360 955 450 1050C360 1145 240 1145 150 1050Z" fill="#DDD3BF" fill-opacity=".08" stroke="#D7B869" stroke-opacity=".2" stroke-width="5"/>
    <path d="M750 1050C840 955 960 955 1050 1050C960 1145 840 1145 750 1050Z" fill="#DDD3BF" fill-opacity=".08" stroke="#D7B869" stroke-opacity=".2" stroke-width="5"/>
  </g>
</svg>
